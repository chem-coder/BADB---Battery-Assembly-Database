<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Recipes</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">

    <style>

      /* ---------- details toggle ---------- */

      details > summary {
        list-style: none;
        cursor: pointer;
        position: relative;
      }

      details > summary::before {
        content: "▸";
        display: inline-block;
        margin-right: 0.5rem;
        transition: transform 0.15s ease;
        color: #666;
      }

      details[open] > summary::before {
        transform: rotate(90deg);
      }

      details[open] > summary {
        background-color: #f6f7f8;
      }

      /* ---------- status visuals ---------- */

      .batch-row[data-status="depleted"],
      .batch-row[data-status="scrap"] {
        opacity: 0.6;
      }

      /* ---------- recipe table ---------- */

      #recipe-composition {
        overflow-x: auto;
      }

      .recipe-table {
        border-collapse: collapse;
        table-layout: fixed;
        min-width: 1200px;
      }

      .recipe-table th,
      .recipe-table td {
        padding: 0.25rem 0.4rem;
        vertical-align: middle;
        white-space: nowrap;
        text-align: left;
      }

      .recipe-table thead th {
        border-bottom: 1px solid #ccc;
        font-weight: 600;
      }

      .recipe-table input,
      .recipe-table select {
        width: 100%;
        box-sizing: border-box;
      }

      /* column sizing */
      .recipe-table th:nth-child(1),
      .recipe-table td:nth-child(1) { width: 180px; }

      .recipe-table th:nth-child(2),
      .recipe-table td:nth-child(2) { width: 260px; }

      /* ---------- controls ---------- */

      .measure-mode {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.15rem;
      }

      .measure-mode label {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
        margin: 0;
      }

      .measure-mode input {
        margin: 0;
      }

    </style>
  </head>

  <body data-page="recipes">
    <header class="page-header">
      <a href="/index.html" aria-label="Главная" class="home-link"><img src="/icons/house-regular.svg" alt=""></a>
      <h1>Рецепты</h1>
    </header>

    <!-- Enter opens the form and copies the name into it -->
    <input
      id="recipe-name"
      type="text"
      name="name"
      class="add-user"
      placeholder="+ Добавить рецепт"
      autocomplete="off"
      required
    />

    <div id="recipe_sticky_header" class="record-sticky-header" hidden>
      <div class="record-sticky-info">
        <div class="record-sticky-title">
          <span id="recipe_sticky_title">Новый рецепт</span>
          <span id="recipe-global-dirty" class="badb-dirty-flag">Не сохранено</span>
        </div>
        <div id="recipe_sticky_meta" class="record-sticky-meta">—</div>
      </div>
      <div class="form-actions record-sticky-actions">
        <button id="saveBtn" type="button" title="Сохранить рецепт">Сохранить</button>
        <button id="printRecipeBtn" type="button" title="Печать отчёта по рецепту" hidden>Печать</button>
        <button id="clearBtn" type="button" title="Выйти из записи">Выйти</button>
        <button id="deleteRecipeBtn" type="button" class="button-danger" title="Удалить рецепт" hidden>Удалить</button>
        <span id="recipe-sticky-status" class="inline_status" aria-live="polite"></span>
      </div>
    </div>

    <!-- Form hidden by default; shown on create/edit -->
    <form name="recipe-form" autocomplete="off" hidden>

      <!-- FormData ignores fields without `name` -->

      <fieldset id="recipe-meta">
        <legend>Метаданные</legend>

        <label for="recipe-created-by">Создал</label>
        <select id="recipe-created-by" name="created_by" disabled>
          <option value="">— автоматически —</option>
        </select>
      </fieldset>

      <fieldset id="recipe-details">
        <legend>Описание рецепта</legend>

        <!-- Name copied here on create / "Enter" -->
        <input
          type="text"
          name="name"
          id="recipe-name-input"
          required
          hidden
        />
        <h2></h2>

        <label for="recipe-variant">Вариант/версия</label>
        <input
          id="recipe-variant"
          type="text"
          name="variant_label"
          placeholder="A / B / low binder / v2"
        />

        <label for="recipe-role">Роль электрода</label>
        <select id="recipe-role" name="role" required disabled>
          <option value="">— выбрать —</option>
          <option value="cathode">катод</option>
          <option value="anode">анод</option>
        </select>

        <label for="recipe-notes">Комментарии</label>
        <textarea
          id="recipe-notes"
          name="notes"
          rows="3"
          placeholder="Кратко: что это за рецепт и чем отличается"
        ></textarea>
      </fieldset>

      <fieldset id="recipe-composition">
        <legend>Состав рецепта</legend>
          <table class="recipe-table">
            <thead>
              <tr>
                <th>Функциональная роль</th>
                <th>Материал</th>
                <th>% в пасте</th>
                <th>Заметки</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="recipe-lines-rows"></tbody>
          </table>
        <button type="button" id="add-recipe-line" title="Добавить компонент рецепта">+ Добавить компонент</button>
        <br>
        <a href="/reference/materials.html" target="_blank" class="ref-link">
          Управление материалами
        </a>
      </fieldset>
    </form>

    <div class="status-feedback" aria-live="polite"></div>

    <div id="recipe_filters" class="recipe-filter-row" aria-label="Фильтры списка рецептов">
      <label class="recipe-filter-field" for="recipe-filter-text">
        <span>Поиск</span>
        <input
          id="recipe-filter-text"
          type="search"
          placeholder="Название, заметки, материалы..."
          autocomplete="off"
        />
      </label>

      <label class="recipe-filter-field" for="recipe-filter-role">
        <span>Роль</span>
        <select id="recipe-filter-role">
          <option value="">Все роли</option>
          <option value="cathode">катод</option>
          <option value="anode">анод</option>
        </select>
      </label>

      <button id="clearRecipeFiltersBtn" type="button" title="Сбросить фильтры">Сбросить</button>
      <span id="recipe-filter-summary" class="recipe-filter-summary" aria-live="polite"></span>
    </div>

    <ul id="recipesList" class="users-list"></ul>

    <script src="/js/auth.js"></script>
    <script src="/js/badb-ui.js?v=badb-ui-20260507a"></script>
    <script src="/js/recipes.js?v=recipes-polish-20260508a"></script>
  </body>
</html>
