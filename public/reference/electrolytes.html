<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Электролиты</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
  </head>

  <body data-page="electrolytes">
    <header class="page-header">
      <a href="/index.html" aria-label="Главная" class="home-link"><img src="/icons/house-regular.svg" alt=""></a>
      <h1>Электролиты</h1>
    </header>

    <!-- Enter opens the form and copies the name into it -->
    <input
      id="electrolyte-name"
      name="name"
      type="text"
      class="add-user"
      placeholder="+ Добавить электролит"
      autocomplete="off"
      required
    />
    
    <div id="electrolyte_sticky_header" class="record-sticky-header" hidden>
      <div class="record-sticky-info">
        <div class="record-sticky-title">
          <span id="electrolyte_sticky_title">Новый электролит</span>
          <span id="electrolyte-global-dirty" class="badb-dirty-flag">Не сохранено</span>
        </div>
        <div id="electrolyte_sticky_meta" class="record-sticky-meta">—</div>
      </div>
      <div class="form-actions record-sticky-actions">
        <button id="printElectrolyteBtn" type="button" hidden>Печать</button>
        <button id="saveBtn" type="button">Сохранить запись</button>
        <button id="clearBtn" type="button">Выход</button>
        <button id="deleteElectrolyteBtn" type="button" class="button-danger" hidden>Удалить электролит</button>
        <span id="electrolyte-sticky-status" class="inline_status" aria-live="polite"></span>
      </div>
    </div>

    <!-- Form hidden by default; shown on create/edit -->
    <form name="electrolyte-form" autocomplete="on" hidden>

      <!-- FormData ignores fields without `name` -->

      <fieldset id="electrolyte-meta">
        <legend>Метаданные</legend>

        <label for="electrolyte-created-by">Создал</label>
        <select id="electrolyte-created-by" name="created_by" disabled>
          <option value="">— автоматически —</option>
        </select><br>

        <label for="electrolyte_type">Тип электролита</label>
        <select id="electrolyte_type" name="electrolyte_type" required>
          <option value="">— выбрать тип —</option>
          <option value="liquid">Жидкий</option>
          <option value="solid">Твёрдый</option>
          <option value="gel">Гелевый</option>
        </select><br>
      </fieldset>

      <fieldset id="electrolyte-chemistry">
        <!-- Name copied here on create / "Enter" -->
        <input
          type="text"
          name="name"
          id="electrolyte-name-input"
          required
          hidden
        />
        <h2></h2>

        <legend>Состав и описание (пока описательно)</legend>

        <label for="electrolyte-solvent-system">Растворители (система)</label>
        <input
          id="electrolyte-solvent-system"
          type="text"
          name="solvent_system"
          placeholder="например: EC/DMC 1:1"
        /><br>

        <label for="electrolyte-salts">Соли</label>
        <input
          id="electrolyte-salts"
          type="text"
          name="salts"
          placeholder="например: LiPF6"
        /><br>

        <label for="electrolyte-concentration">Концентрация</label>
        <input
          id="electrolyte-concentration"
          type="text"
          name="concentration"
          placeholder="например: 1 M"
        /><br>

        <label for="electrolyte-additives">Добавки</label>
        <input
          id="electrolyte-additives"
          type="text"
          name="additives"
          placeholder="например: 2% VC"
        /><br>

        <label for="electrolyte-notes">Примечания</label><br>
        <textarea
          id="electrolyte-notes"
          name="notes"
          rows="3"
          placeholder="Любая дополнительная информация"
        ></textarea>
      </fieldset>
      
      <fieldset id="electrolyte-status">
        <legend>Статус</legend>

        <label>Статус</label>
        <select name="status">
          <option value="active">активный</option>
          <option value="inactive">не используется</option>
          <option value="archived">архив</option>
        </select>
      </fieldset>

      <fieldset id="electrolyte-files">
        <legend>Файлы</legend>

        <label for="electrolyte-files-input">Загрузить файлы</label>
        <input
          id="electrolyte-files-input"
          type="file"
          multiple
        />
        <button id="saveFilesBtn" type="button" hidden>Сохранить файлы</button>
        <span id="electrolyte-files-status" class="inline_status" aria-live="polite"></span>
        <div id="electrolyte-files-saved"></div>
      </fieldset>

    </form>
    <div class="status-feedback" aria-live="polite"></div>

    <div id="electrolyte_filters" class="electrolyte-filter-row" aria-label="Фильтры списка электролитов">
      <label class="electrolyte-filter-field" for="electrolyte-filter-text">
        <span>Поиск</span>
        <input
          id="electrolyte-filter-text"
          type="search"
          placeholder="Название, соли, растворители..."
          autocomplete="off"
        />
      </label>

      <label class="electrolyte-filter-field" for="electrolyte-filter-status">
        <span>Статус</span>
        <select id="electrolyte-filter-status">
          <option value="">Все статусы</option>
          <option value="active">активный</option>
          <option value="inactive">не используется</option>
          <option value="archived">архив</option>
        </select>
      </label>

      <label class="electrolyte-filter-field" for="electrolyte-filter-type">
        <span>Тип</span>
        <select id="electrolyte-filter-type">
          <option value="">Все типы</option>
          <option value="liquid">жидкий</option>
          <option value="solid">твёрдый</option>
          <option value="gel">гелевый</option>
        </select>
      </label>

      <button id="clearElectrolyteFiltersBtn" type="button">Сбросить</button>
      <span id="electrolyte-filter-summary" class="electrolyte-filter-summary" aria-live="polite"></span>
    </div>

    <ul id="electrolytesList" class="users-list"></ul>

    <script src="/js/auth.js"></script>
    <script src="/js/badb-ui.js?v=badb-ui-20260505a"></script>
    <script src="/js/electrolytes.js?v=electrolyte-filters-20260507a"></script>
  </body>
</html>
