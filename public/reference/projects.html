<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Проекты</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
  </head>

  <body data-page="projectsList">
    <header class="page-header">
      <a href="/index.html" aria-label="Главная" class="home-link"><img src="/icons/house-regular.svg" alt=""></a>
      <h1>Проекты</h1>
    </header>

    <!-- Enter opens the form and copies the name into it -->
    <input
      id="project-name"
      type="text" 
      name="name"
      class="add-user"
      placeholder="+ Добавить проект"
      autocomplete="off"
      required
    />
    
    <!-- Form hidden by default; shown on create/edit -->
    <form name="project-form" autocomplete="off" hidden>

      <!-- FormData ignores fields without `name` -->

      <fieldset id="project-meta">
        <legend>Метаданные</legend>

        <label for="project-created-by">Создал</label>
        <select id="project-created-by" name="created_by" disabled>
          <option value="">— автоматически —</option>
        </select>
      </fieldset>

      <fieldset id="project-details">

        <!-- Name copied here on create / "Enter" -->
        <input
          type="text"
          name="name"
          id="project-name-input"
          required
          hidden
        />
        <h2></h2>

        <label for="project-lead-id">Руководитель</label>
        <select id="project-lead-id" name="lead_id">
          <option value="">— выбрать пользователя —</option>
        </select><br>

        <label for="project-description">Описание проекта </label><br>
        <textarea
          id="project-description"
          name="description"
          rows="3"
          cols="50"
          placeholder="Единицы измерения, методики (Гурли и т.п.), особые замечания"
        ></textarea>

        <label for="project-start-date">Дата начала</label>
        <input id="project-start-date" type="date" name="start_date">

        <label for="project-due-date">Плановая дата окончания</label>
        <input id="project-due-date" type="date" name="due_date">
      </fieldset>

      <fieldset id="project-status">
        <legend>Статус</legend>

        <label for="project-status-select">Статус</label>
        <select id="project-status-select" name="status">
          <option value="active">активный</option>
          <option value="paused">приостановлен</option>
          <option value="completed">завершен</option>
          <option value="archived">архивирован</option>
        </select>
      </fieldset>

      <fieldset id="project-access">
        <legend>Доступ</legend>

        <label for="project-confidentiality-level">Видимость</label>
        <select id="project-confidentiality-level" name="confidentiality_level">
          <option value="public">Все</option>
          <option value="department">Отдел</option>
          <option value="confidential">Выборочно</option>
        </select><br>

        <div id="project-department-block" hidden>
          <label for="project-department-id">Отдел</label>
          <select id="project-department-id" name="department_id">
            <option value="">— выбрать отдел —</option>
          </select>
        </div>
      </fieldset>

      <fieldset id="project-department-access-section" hidden>
        <legend>Доступ к проекту</legend>

        <div class="form-grid cols-3">
          <div class="form-field">
            <label for="project-access-department-id">Отдел</label>
            <select id="project-access-department-id">
              <option value="">— выбрать отдел —</option>
            </select>
          </div>

          <div class="form-field">
            <label for="project-access-expires-at">Доступ до</label>
            <input id="project-access-expires-at" type="date">
          </div>

          <div class="form-field">
            <label>&nbsp;</label>
            <button id="grantDepartmentAccessBtn" type="button">Добавить отдел</button>
          </div>
        </div>

        <table class="project-access-table">
          <thead>
            <tr>
              <th>Отдел</th>
              <th>Уровень</th>
              <th>Доступ до</th>
              <th>Выдал</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="projectDepartmentAccessBody"></tbody>
        </table>

        <h3>Пользователи с доступом</h3>
        <table class="project-access-table">
          <thead>
            <tr>
              <th>Пользователь</th>
              <th>Отдел</th>
              <th>Источник</th>
              <th>Уровень</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="projectUserAccessBody"></tbody>
        </table>

        <div class="form-grid cols-3 project-user-access-add">
          <div class="form-field">
            <label for="project-access-user-id">Дополнительный пользователь</label>
            <select id="project-access-user-id">
              <option value="">— выбрать пользователя —</option>
            </select>
          </div>

          <div class="form-field">
            <label for="project-user-access-level">Уровень доступа</label>
            <select id="project-user-access-level">
              <option value="view">просмотр</option>
              <option value="edit">редактирование</option>
              <option value="admin">администратор проекта</option>
            </select>
          </div>

          <div class="form-field">
            <label>&nbsp;</label>
            <button id="grantUserAccessBtn" type="button">Добавить пользователя</button>
          </div>
        </div>
      </fieldset>

      <button id="saveBtn" type="button">Сохранить запись</button>
      <button id="clearBtn" type="button">Очистить форму</button>
      <button id="exitBtn" type="button">Выход</button><br>

    </form>

    <div class="status-feedback" aria-live="polite"></div>
    <ul id="projectsList" class="users-list"></ul>

    <script src="/js/auth.js"></script>
    <script src="/js/projects.js"></script>
    
  </body>
</html>
