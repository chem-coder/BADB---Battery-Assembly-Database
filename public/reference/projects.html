<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Проекты</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
  </head>

  <body data-page="projectsList">
    <header class="page-header">
      <a href="/index.html" aria-label="Главная" class="home-link"><img src="/icons/house-regular.svg" alt=""></a>
      <h1>Проекты</h1>
    </header>

    <!-- Enter opens the form and copies the name into it -->
    <input
      id="project-name"
      type="text"
      name="name"
      class="add-user"
      placeholder="+ Добавить проект"
      autocomplete="off"
      required
    />

    <div id="project_sticky_header" class="record-sticky-header" hidden>
      <div class="record-sticky-info">
        <div class="record-sticky-title">
          <span id="project_sticky_title">Новый проект</span>
          <span id="project-global-dirty" class="badb-dirty-flag">Не сохранено</span>
        </div>
        <div id="project_sticky_meta" class="record-sticky-meta">—</div>
      </div>
      <div class="form-actions record-sticky-actions">
        <button id="saveBtn" type="button" title="Сохранить изменения">Сохранить</button>
        <button id="printProjectBtn" type="button" title="Печать отчёта" hidden>Печать</button>
        <button id="exitBtn" type="button" title="Вернуться к списку, не выходя из аккаунта">Выйти</button>
        <button id="deleteProjectBtn" type="button" class="button-danger" title="Удалить запись" hidden>Удалить</button>
        <span id="project-sticky-status" class="inline_status" aria-live="polite"></span>
      </div>
    </div>
    
    <!-- Form hidden by default; shown on create/edit -->
    <form name="project-form" autocomplete="off" hidden>

      <!-- FormData ignores fields without `name` -->

      <fieldset id="project-details" class="project-main-fieldset">
        <legend class="sr-only">Проект</legend>

        <!-- Name copied here on create / "Enter" -->
        <input
          type="text"
          name="name"
          id="project-name-input"
          required
          hidden
        />
        <h2></h2>

        <input id="project-description" type="hidden" name="description">
        <input id="project-start-date" type="hidden" name="start_date">
        <input id="project-due-date" type="hidden" name="due_date">

        <div class="project-form-line project-audit-line">
          <label for="project-created-by">создал</label>
          <input id="project-created-by" type="text" disabled value="">
          <input id="project-created-at" type="text" disabled value="" aria-label="Дата создания">
        </div>

        <div class="project-form-line project-lead-line">
          <label for="project-lead-id">Руководитель</label>
          <select id="project-lead-id" name="lead_id">
            <option value="">— выбрать пользователя —</option>
          </select>
        </div>

        <div class="project-form-line project-status-line">
          <label for="project-status-select">Статус</label>
          <select id="project-status-select" name="status">
            <option value="active">активный</option>
            <option value="paused">приостановлен</option>
            <option value="completed">завершен</option>
            <option value="archived">архивирован</option>
          </select>

          <label for="project-confidentiality-level">Доступ</label>
          <select id="project-confidentiality-level" name="confidentiality_level">
            <option value="public">открытый</option>
            <option value="confidential">ограниченный</option>
          </select>
        </div>
      </fieldset>

      <fieldset id="project-participants-section" hidden>
        <legend>Команда</legend>

        <div class="project-participant-add">
          <div class="project-team-add-line">
            <div class="form-field project-team-user-field">
              <label class="sr-only" for="project-participant-user-id">Пользователь</label>
              <select id="project-participant-user-id">
                <option value="">— выбрать пользователя —</option>
              </select>
            </div>

            <label for="project-participant-access-level">Доступ</label>
            <select id="project-participant-access-level">
              <option value="view">просмотр</option>
              <option value="edit">редактирование</option>
              <option value="admin">администратор проекта</option>
            </select>

            <button id="addProjectParticipantBtn" type="button" title="Добавить в команду">+ Добавить в команду</button>
          </div>

          <div class="project-team-role-line">
            <label for="project-participant-role">Функциональная роль</label>
            <input
              id="project-participant-role"
              type="text"
              autocomplete="off">
          </div>
        </div>

        <table class="project-access-table project-participants-table">
          <thead>
            <tr>
              <th>№</th>
              <th>Пользователь</th>
              <th>Роль в команде (функционал)</th>
              <th>Доступ</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="projectParticipantsBody"></tbody>
        </table>
      </fieldset>

      <div id="project-department-block" hidden>
        <label for="project-department-id">Отдел</label>
        <select id="project-department-id" name="department_id">
          <option value="">— выбрать отдел —</option>
        </select>
      </div>

    </form>

    <div class="status-feedback" aria-live="polite"></div>

    <div id="project_filters" class="project-filter-row" aria-label="Фильтры списка проектов">
      <div class="project-filter-line project-filter-line-top">
        <label class="project-filter-field project-filter-search" for="project-filter-text">
          <span>Поиск</span>
          <input
            id="project-filter-text"
            type="search"
            placeholder="Название, описание, руководитель..."
            autocomplete="off"
          />
        </label>

        <label class="project-filter-field project-filter-lead" for="project-filter-lead">
          <span>Руководитель</span>
          <span class="project-filter-control-line">
            <select id="project-filter-lead">
              <option value="">Все руководители</option>
            </select>
          </span>
        </label>
      </div>

      <div class="project-filter-line project-filter-line-bottom">
        <label class="project-filter-field" for="project-filter-status">
          <span>Статус</span>
          <select id="project-filter-status">
            <option value="">Все статусы</option>
            <option value="active">активный</option>
            <option value="paused">приостановлен</option>
            <option value="completed">завершён</option>
            <option value="archived">архивирован</option>
          </select>
        </label>

        <label class="project-filter-field" for="project-filter-visibility">
          <span>Тип проекта</span>
          <select id="project-filter-visibility">
            <option value="">Все типы</option>
            <option value="public">открытый</option>
            <option value="confidential">ограниченный</option>
          </select>
        </label>

        <button id="clearProjectFiltersBtn" type="button" title="Сбросить фильтры">Сбросить</button>
      </div>
      <span id="project-filter-summary" class="project-filter-summary" aria-live="polite"></span>
    </div>

    <ul id="projectsList" class="users-list"></ul>

    <script src="/js/auth.js"></script>
    <script src="/js/badb-ui.js?v=badb-ui-20260507a"></script>
    <script src="/js/projects.js?v=project-layout-20260602b"></script>
    
  </body>
</html>
